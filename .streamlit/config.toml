# Tema do Radar de Avaliações. Fica só aqui, sem CSS injetado no app.py.
# Só a seção [theme], sem [theme.light]/[theme.dark]: a aparência fica travada no claro.

[theme]
base = "light"

# Azul como identidade; coral só para sinalizar problema.
primaryColor = "#1D4ED8"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#E6EBF3"
textColor = "#14284B"
borderColor = "#CBD4E1"
linkColor = "#1D4ED8"

redColor = "#D9485F"
orangeColor = "#A85A00"
greenColor = "#1F7A5C"

# Gráficos seguem a mesma paleta (quem define cor explícita no gráfico tem prioridade).
chartCategoricalColors = ["#1D4ED8", "#D9485F", "#A85A00", "#14284B", "#7A869A", "#7A4E8C"]
chartSequentialColors = ["#EEF3FE", "#D8E2FB", "#BCCDF8", "#9BB4F4", "#7898EE", "#577DE7", "#3A64DF", "#1D4ED8", "#183FAE", "#14284B"]

# Títulos com personalidade; o corpo fica neutro para leitura.
font = "'Instrument Sans':https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Bricolage Grotesque':https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&display=swap"
# As respostas sugeridas saem em fonte de impressora de comanda.
codeFont = "'Courier Prime':https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap"
codeFontSize = "0.875rem"

# h1 = nome do app (discreto), h2 = frase-resumo (o maior texto da página), h3 = seções.
headingFontSizes = ["1.25rem", "2.5rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
metricValueFontSize = "2rem"
metricValueFontWeight = 600

baseRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "1.5rem"
paddingBottom = "3rem"

# Barra lateral escura: conjunto completo de cores para manter o contraste.
[theme.sidebar]
backgroundColor = "#14284B"
secondaryBackgroundColor = "#1F3A66"
codeBackgroundColor = "#1F3A66"
textColor = "#EAF0FA"
borderColor = "#3B5687"
primaryColor = "#9DBBFF"
linkColor = "#9DBBFF"
